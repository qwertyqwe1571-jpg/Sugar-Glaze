<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Sugar & Glaze</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-block">
        <h1>Sugar &amp; Glaze Admin</h1>
      </div>

      <div class="topbar-actions">
        <div class="pill" id="adminIdentity">Завантаження сесії...</div>
        <a href="/" class="top-link">До магазину</a>
        <a href="/account.html" class="top-link">Мій кабінет</a>
        <button type="button" class="top-btn" id="logoutBtn">Вийти</button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <section class="card">
      <div class="card-head">
        <h2 id="productFormTitle">Додати товар</h2>
      </div>

      <div class="edit-banner" id="editBanner"></div>
      <div class="form-message" id="productFormMessage"></div>

      <form id="addProductForm" class="stack" novalidate>
        <div class="field">
          <label for="productName">Назва товару</label>
          <input id="productName" type="text" placeholder="Назва товару" />
        </div>

        <div class="field">
          <label for="productPrice">Ціна, грн</label>
          <input id="productPrice" type="number" min="1" step="0.01" placeholder="450" />
        </div>

        <div class="field">
          <label for="productDesc">Опис</label>
          <textarea id="productDesc" placeholder="Опис"></textarea>
        </div>

        <div class="field">
          <label>Фото товару</label>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" />
            <div class="upload-copy">Обрати фото</div>
          </div>
          <img id="imagePreview" alt="Прев'ю товару" />
          <div class="upload-progress" id="uploadProgress">
            <div class="upload-progress-bar" id="uploadProgressBar"></div>
          </div>
          <div class="upload-status" id="uploadStatus"></div>
          <div class="image-actions">
            <button type="button" class="ghost-btn" id="clearImageBtn" disabled>Очистити фото</button>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="primary-btn" id="submitBtn">Зберегти товар</button>
          <button type="button" class="ghost-btn" id="cancelEditBtn" style="display:none">Скасувати редагування</button>
        </div>
      </form>
    </section>

    <section class="main-column">
      <section class="card section-card">
        <div class="card-head">
          <h2>Каталог</h2>
        </div>

        <div class="toolbar">
          <div class="toolbar-field">
            <label for="productSearch">Пошук по товарах</label>
            <input id="productSearch" type="search" placeholder="Назва або опис..." />
          </div>
          <div class="toolbar-field">
            <label for="productSort">Сортування</label>
            <select id="productSort" class="toolbar-select">
              <option value="newest">Спочатку новіші</option>
              <option value="name_asc">Назва: А-Я</option>
              <option value="name_desc">Назва: Я-А</option>
              <option value="price_asc">Ціна: за зростанням</option>
              <option value="price_desc">Ціна: за спаданням</option>
            </select>
          </div>
          <div class="toolbar-actions">
            <button type="button" class="ghost-btn" id="applyProductFiltersBtn">Застосувати</button>
          </div>
          <div class="toolbar-field">
            <label for="productCount">Результат</label>
            <input id="productCount" type="text" readonly value="0 товарів" />
          </div>
        </div>

        <div class="product-list" id="productsList">
          <div class="empty-state">Завантаження каталогу...</div>
        </div>

        <div class="pagination">
          <div class="pagination-info" id="productPageInfo">Сторінка 1 з 1</div>
          <div class="pagination-actions">
            <button type="button" class="pagination-btn" id="productPrevBtn">Назад</button>
            <button type="button" class="pagination-btn" id="productNextBtn">Далі</button>
          </div>
        </div>
      </section>

      <section class="card section-card">
        <div class="card-head">
          <h2>Замовлення клієнтів</h2>
        </div>

        <div class="toolbar orders-toolbar">
          <div class="toolbar-field">
            <label for="orderSearch">Пошук по замовленнях</label>
            <input id="orderSearch" type="search" placeholder="Номер, клієнт, телефон, email..." />
          </div>
          <div class="toolbar-field">
            <label for="orderStatusFilter">Фільтр статусу</label>
            <select id="orderStatusFilter" class="toolbar-select">
              <option value="all">Усі статуси</option>
              <option value="new">Нові</option>
              <option value="confirmed">Підтверджені</option>
              <option value="completed">Завершені</option>
              <option value="cancelled">Скасовані</option>
            </select>
          </div>
          <div class="toolbar-field">
            <label for="orderSort">Сортування</label>
            <select id="orderSort" class="toolbar-select">
              <option value="newest">Спочатку новіші</option>
              <option value="oldest">Спочатку старіші</option>
              <option value="total_desc">Сума: від більшої</option>
              <option value="total_asc">Сума: від меншої</option>
              <option value="customer_asc">Клієнт: А-Я</option>
              <option value="status_asc">Статус: А-Я</option>
            </select>
          </div>
          <div class="toolbar-actions">
            <button type="button" class="ghost-btn" id="applyOrderFiltersBtn">Застосувати</button>
          </div>
          <div class="toolbar-field">
            <label for="orderCount">Результат</label>
            <input id="orderCount" type="text" readonly value="0 замовлень" />
          </div>
        </div>

        <div class="orders-list" id="ordersList">
          <div class="empty-state">Завантаження замовлень...</div>
        </div>

        <div class="pagination">
          <div class="pagination-info" id="orderPageInfo">Сторінка 1 з 1</div>
          <div class="pagination-actions">
            <button type="button" class="pagination-btn" id="orderPrevBtn">Назад</button>
            <button type="button" class="pagination-btn" id="orderNextBtn">Далі</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="icons.js"></script>
  <script src="security.js"></script>
  <script src="modal.js"></script>
  <script src="admin.js"></script>
</body>
</html>
