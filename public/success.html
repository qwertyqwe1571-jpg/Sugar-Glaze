<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Замовлення прийнято | Sugar & Glaze</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #fdf8f3 0%, #f7ecdf 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: #3d2b1f;
    }
    .box {
      background: white;
      border-radius: 18px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 16px 44px rgba(61, 43, 31, 0.12);
      max-width: 560px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff6db;
      color: #8a6a12;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 18px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin: 0 0 14px;
    }
    p {
      color: #7b675c;
      line-height: 1.65;
      margin: 0 0 16px;
    }
    .order-id {
      margin: 22px 0;
      padding: 14px 18px;
      border-radius: 12px;
      background: #f8f2ec;
      color: #5d4638;
      font-weight: 600;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    a {
      background: #c9a84c;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    a:hover {
      background: #3d2b1f;
    }
    .subtle-link {
      background: #f3ede6;
      color: #3d2b1f;
    }
    @media (max-width: 640px) {
      .box {
        padding: 36px 24px;
      }
      h1 {
        font-size: 1.7rem;
      }
      .actions {
        flex-direction: column;
      }
      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">Демо-режим без онлайн-оплати</div>
    <div class="icon">🍰</div>
    <h1>Замовлення прийнято</h1>
    <p>Ми зберегли ваше замовлення та передали сповіщення менеджеру.</p>
    <p id="mailStatus">Найближчим часом з вами зв'яжуться для підтвердження деталей замовлення.</p>
    <div class="order-id" id="orderIdBox" hidden>Номер замовлення: <span id="orderIdText"></span></div>
    <div class="actions">
      <a href="/">Повернутися до магазину</a>
      <a class="subtle-link" href="/admin.html">Відкрити адмін-панель</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const mail = params.get('mail');

    if (orderId) {
      document.getElementById('orderIdText').textContent = orderId;
      document.getElementById('orderIdBox').hidden = false;
    }

    if (mail === 'sent') {
      document.getElementById('mailStatus').textContent =
        "Сповіщення про замовлення вже надіслано на email магазину.";
    }
  </script>
</body>
</html>
